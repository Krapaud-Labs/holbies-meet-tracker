services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://holbies:holbies@postgres:5432/holbies
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: holbies
      POSTGRES_PASSWORD: holbies
      POSTGRES_DB: holbies
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
