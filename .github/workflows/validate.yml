name: Validate extension

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript
        run: |
          node --check popup.js
          node --check attendance.js

      - name: Run attendance tests
        run: node tests/attendance.test.js

      - name: Validate manifest
        run: python3 -m json.tool manifest.json >/dev/null

      - name: Check whitespace
        run: git diff --check
