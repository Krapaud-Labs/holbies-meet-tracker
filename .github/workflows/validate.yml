name: Validate extension

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  checks:
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate JavaScript
        run: |
          node --check popup.js
          node --check attendance.js

      - name: Run extension tests
        run: node --test tests/*.test.js

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Validate backend
        run: |
          node --check backend/src/server.js
          node --check backend/src/live.js
          npm test --prefix backend

      - name: Build backend image
        run: docker build backend

      - name: Validate manifest
        run: python3 -m json.tool manifest.json >/dev/null

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"
