name: Update workspace kit

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-kit-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Detect latest kit version
        id: version
        run: |
          latest="$(curl -fsSL https://raw.githubusercontent.com/Krapaud-Labs/AGENTIC-Starter-Kits/main/VERSION)"
          current="$(sed -n 's/^kit_version = \"\(.*\)\"/\1/p' .workspace.toml)"
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$latest" =~ $version_pattern ]] || { echo "Version distante invalide." >&2; exit 1; }
          [[ "$current" =~ $version_pattern ]] || { echo "Version locale invalide." >&2; exit 1; }
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update workspace manifest
        if: steps.version.outputs.changed == 'true'
        env:
          LATEST_VERSION: ${{ steps.version.outputs.latest }}
        run: |
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$LATEST_VERSION" =~ $version_pattern ]] || { echo "Version distante invalide." >&2; exit 1; }
          sed -i.bak "s/^kit_version = .*/kit_version = \"$LATEST_VERSION\"/" .workspace.toml
          rm -f .workspace.toml.bak

      - name: Open update pull request
        if: steps.version.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: chore/update-workspace-kit
          base: dev
          delete-branch: true
          title: 'chore: update workspace kit to v${{ steps.version.outputs.latest }}'
          commit-message: 'chore: update workspace kit manifest'
          add-paths: .workspace.toml
          body: |
            Mise à jour de la version du kit externe.

            Le contenu du kit reste local à la machine et n’est pas publié dans ce dépôt.
